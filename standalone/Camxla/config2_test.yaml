system:
  initial_state: 2
  load_mode: 1       # CHỈ nạp model KFS (V2)
  force_square: true
  headless: false    # BẬT cửa sổ hiển thị OpenCV GUI
  udp_stream: false
  test_image: false

hardware:
  camera:
    device_id: 0
    width: 640
    height: 480

v2_model:
  name: "KFS"
  yolo_engine: "models/yolo_kfs.engine"
  yolo_device: "GPU"
  cnn_engine: "models/cnn.engine"
  cnn_device: "GPU"
  labels_json: "models/labels_cnn_kfs.json"
  yolo_input_size: 512
  cnn_input_size: 64
  conf_threshold_yolo: 0.7
  conf_threshold_cnn: 0.7
  background_value: 128
  target_types: ["REAL"]